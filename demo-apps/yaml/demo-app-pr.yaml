apiVersion: apis.clusterfleet.io/v1alpha1
kind: Application
metadata:
  annotations:
    microsoft-falcon.net/clusterip-check: "disabled"
    microsoft-falcon.net/falcon-core-service: "true"
  name: demo-app
  namespace: clusterfleet
spec:
  version: "DEPLOYMENT_APP_VERSION"
  rolloutStrategy:
    progressiveRollout:
      progressiveRolloutWindowSize: 1
      perClusterMinimumAvailableReplicasPct: 99%
      perClusterRolloutDeadlineSeconds: 15
      maxAllowedClustersPastDeadline: 10%
  workload:
    - manifest:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: demo-app
          namespace: clusterfleet
        spec:
          updateStrategy:
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 3
            type: RollingUpdate
          replicas: 3
          selector:
            matchLabels:
              app: demo-app
          serviceName: ""
          template:
            metadata:
              labels:
                app: demo-app
                test: "6"
            spec:
              containers:
              - args:
                  - --http-port
                  - "12012"
                  - --startup-delay
                  - "0"
                env:
                - name: TIMESTAMP
                  value: "DEPLOYMENT_TIMESTAMP"
                envFrom:
                - configMapRef:
                    name: clusterfleet-config
                image: demo-app:DEPLOYMENT_IMAGE_VERSION
                name: demo-app
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /keepalive
                    port: 12012
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 2
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /ready
                    port: 12012
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 2
                resources:
                  requests:
                    cpu: 50m
                    memory: 128Mi
                  limits:
                    cpu: 100m
                    memory: 256Mi
              dnsPolicy: ClusterFirst
              restartPolicy: Always
              nodeSelector:
                kubernetes.io/os: linux
                scheduler.clusterfleet.io/ready: "true"
                kubernetes.azure.com/mode: "user"
