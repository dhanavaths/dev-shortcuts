apiVersion: apis.clusterfleet.io/v1alpha1
kind: Application
metadata:
  annotations:
    microsoft-falcon.net/clusterip-check: "disabled"
    microsoft-falcon.net/falcon-core-service: "true"
  name: demo-app-ss
  namespace: clusterfleet
spec:
  version: "DEPLOYMENT_APP_VERSION"
  rolloutStrategy:
    minAvailableReplicas: 100%
  workload:
    - manifest:
        apiVersion: apps/v1
        kind: StatefulSet
        metadata:
          name: demo-app-ss
          namespace: clusterfleet
        spec:
          updateStrategy:
            rollingUpdate:
              maxUnavailable: 1
            type: RollingUpdate
          replicas: 3
          selector:
            matchLabels:
              app: demo-app-ss
          serviceName: ""
          template:
            metadata:
              labels:
                app: demo-app-ss
            spec:
              containers:
              - args:
                  - --http-port
                  - "12012"
                  - --startup-delay
                  - "0"
                env:
                - name: TIMESTAMP
                  value: "DEPLOYMENT_TIMESTAMP"
                envFrom:
                - configMapRef:
                    name: clusterfleet-config
                image: demo-app:DEPLOYMENT_IMAGE_VERSION
                name: demo-app-ss
                livenessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /liveness
                    port: 12012
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 2
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /ready
                    port: 12012
                    scheme: HTTP
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 2
              dnsPolicy: ClusterFirst
              restartPolicy: Always
              nodeSelector:
                kubernetes.io/os: linux
                scheduler.clusterfleet.io/ready: "true"
                kubernetes.azure.com/mode: "user"
